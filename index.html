ua2k:"Recht",ua2h:"Klarer Rechtsrahmen",ua2:"Das Cannabisgesetz von 2024 regelt Anbau, Verarbeitung und medizinische Nutzung. CBD-Isolat steht nicht auf der Liste kontrollierter Substanzen.",
ua3k:"Wirkung",ua3h:"Wiederaufbau mit Wirkung",ua3:"Jeder investierte Franken schafft Arbeitsplätze in ländlichen Regionen und stärkt eine Wirtschaft, die sich neu aufbauen muss.",

s2h:"Wenig Wasser, keine Pestizide",s2:"Die dichte Pflanze unterdrückt Unkraut von selbst und kommt in der Regel ohne chemischen Pflanzenschutz aus.",
s3h:"Böden regenerieren",s3:"Hanf lockert den Boden und kann Schadstoffe aufnehmen. In der Region Tschornobyl wurde er zur Bodensanierung erforscht.",
s4h:"Die ganze Pflanze nutzen",s4:"Blüten für CBD, Fasern für Textilien und Baustoffe, Samen für Lebensmittel. Es fällt kaum Abfall an.",
u_e:"Anwendungsbereiche",u_h:"Wo CBD-Öl heute eingesetzt wird",

u1h:"Beauty & Hautpflege",u1:"Seren, Cremes und Balsame mit CBD sind ein fester Bestandteil der Naturkosmetik und ein stark wachsendes Premium-Segment.",u1t:"Kosmetik",
u2h:"Entspannung & Schlaf",u2:"Viele Menschen nutzen CBD-Öl als Teil ihrer Abendroutine, um zur Ruhe zu kommen.",u2t:"Wellness",
u3h:"Sport & Regeneration",u3:"Athletinnen und Athleten setzen CBD-Öle und -Balsame nach dem Training ein. Die Welt-Anti-Doping-Agentur hat CBD 2018 von der Verbotsliste gestrichen.",u3t:"Sport",
u4h:"Medizinische Forschung",u4:"Ein Arzneimittel auf CBD-Basis ist in der EU und den USA gegen seltene Epilepsieformen zugelassen. Weitere Einsatzgebiete werden in Studien untersucht.",u4t:"Pharma",

lz_e:"Our edge",lz_h:"Medical hemp with over 20% CBD. Our own fields.",

lz3k:"Science",lz3h:"Medical partnership in Kyiv",lz3:"We work with <span class=\"ph\">[Prof. name]</span> and <span class=\"ph\">[hospital]</span> in Kyiv, one of the most renowned institutions in the country.",

ua_e:"Location",ua_h:"Why Ukraine. Why now.",
ua_l:"Ukraine is one of Europe's largest agricultural nations with a long tradition of growing hemp. Since August 2024, industrial hemp only requires a notification to the authorities; licences and quotas are gone. At the same time, the war-torn country needs private investment that creates jobs and keeps value in the country.",
ua1k:"Soil",ua1h:"Fertile black soil",ua1:"Chernozem soils are among the most productive in the world and offer ideal conditions for hemp.",
ua2k:"Law",ua2h:"A clear legal framework",ua2:"The 2024 Cannabis Law regulates cultivation, processing and medical use. CBD isolate is not on the list of controlled substances.",
ua3k:"Impact",ua3h:"Reconstruction with impact",ua3:"Every franc invested creates jobs in rural regions and strengthens an economy that has to rebuild.",
ua4k:"Market",ua4h:"Close to the EU",ua4:"Ukraine is aligning its product and food standards with the EU, opening the way to the Swiss and European markets.",
impact:"Investing here funds more than a product: work, prospects and a green future for Ukraine.",

sus_q:"“Hemp is one of the few crops that leaves the soil better than it found it.”",
s1h:"A natural carbon store",s1:"Hemp grows into large biomass in about 100 days, drawing a lot of CO<sub>2</sub> from the atmosphere.",
s2h:"Little water, no pesticides",s2:"The dense crop suppresses weeds on its own and usually needs no chemical crop protection.",
s3h:"Regenerating soil",s3:"Hemp loosens soil and can absorb pollutants. It has been studied for soil remediation in the Chornobyl region.",
s4h:"Using the whole plant",s4:"Flowers for CBD, fibre for textiles and building materials, seeds for food. Almost nothing goes to waste.",
u_e:"Applications",u_h:"Where CBD oil is used today",
u_l:"CBD (cannabidiol) is a natural compound of the hemp plant and is not intoxicating. Demand comes from many industries at once, which spreads risk and grows the market.",
u1h:"Beauty & skincare",u1:"Serums, creams and balms with CBD are an established part of natural cosmetics and a fast-growing premium segment.",u1t:"Cosmetics",
u2h:"Relaxation & sleep",u2:"Many people use CBD oil as part of their evening routine to unwind.",u2t:"Wellness",
u3h:"Sport & recovery",u3:"Athletes use CBD oils and balms after training. The World Anti-Doping Agency removed CBD from its prohibited list in 2018.",u3t:"Sport",
u4h:"Medical research",u4:"A CBD-based medicine is approved in the EU and the US for rare forms of epilepsy. Further uses are being studied.",u4t:"Pharma",
u5h:"Food & beverages",u5:"Oils, teas and drinks with CBD. In the EU they require Novel Food authorisation. Whoever holds it has a head start.",u5t:"Food",
u6h:"Pet care",u6:"CBD products for dogs and horses are a young, fast-growing niche market.",u6t:"Pet care",
u_note:"Note: CBD products are not medicines. ZELENA markets its products without health claims and in line with the rules of each target country.",

lz_e:"Наша перевага",lz_h:"Медичні коноплі з понад 20 % CBD. Власні поля.",
lz_l:"ZELENA — не посередник. Ми вирощуємо на власних полях і контролюємо кожен крок аж до готової олії. В Україні медичний канабіс із високим вмістом ТГК дозволено вирощувати лише за державною ліцензією та в межах квот. Саме цей бар'єр і є нашою конкурентною перевагою.",
lz1k:"Ліцензія",lz1h:"Вирощування за державною ліцензією",lz1:"Вирощування для медичних цілей за державною ліцензією та квотою, із повним контролем. Ліцензія № <span class=\"ph\">[номер]</span>, видана <span class=\"ph\">[орган]</span>.",
lz2k:"Контроль",lz2h:"Від поля до олії — в одних руках",lz2:"Вирощування, збирання, екстракція та очищення — під нашим власним контролем. Без посередників, з повним забезпеченням якості.",
lz3k:"Наука",lz3h:"Медичне партнерство в Києві",lz3:"Ми співпрацюємо з <span class=\"ph\">[проф. ім'я]</span> та <span class=\"ph\">[лікарня]</span> у Києві — однією з найавторитетніших установ країни.",
lz4h:"працівників на місці",hall_n:"2 × 4 000 м²",hall_h:"Високотехнологічні корпуси для медичних конопель",hall:"Два виробничі корпуси площею по 4 000 м², обладнані за найновішими технологіями. Контрольоване вирощування в приміщенні гарантує стабільну медичну якість — урожай за урожаєм.",lz4:"Вони доглядають і охороняють наші поля. Безпека та простежуваність на рівні фармацевтичних стандартів.",
eyebrow:"Коноплі з України · Капітал зі Швейцарії",
h1:"Зелене зростання, що <em>пускає коріння.</em>",
lead:"ZELENA створює в Україні повний ланцюг виробництва CBD: від сертифікованих технічних конопель до лабораторно перевіреної олії для Швейцарії та Європи. Для інвесторів, які прагнуть поєднати прибутковість, сталий розвиток і відбудову.",

t1:"Медичні коноплі з понад 20 % CBD",q0:"Наші медичні коноплі мають понад 20 % CBD. Законодавчої межі для CBD немає, обмежений лише ТГК.",t2:"Сертифікат аналізу для кожної партії",t3:"Законодавчо врегульовано з 2024 року",
f1n:"9,4 млрд $",f1:"Світовий ринок CBD у 2026 році",f2n:"15,4 млрд $",f2:"Прогноз на 2033 рік",f3:"Щорічне зростання ринку (CAGR 2026–2033)",f4:"Україна: вирощування конопель за повідомленням, без ліцензії",
src:"Джерела: Persistence Market Research (Cannabidiol Market 2026–2033); CMS Legal Roadmap to Cannabis – Ukraine",
ua_e:"Локація",ua_h:"Чому Україна. Чому саме зараз.",
ua_l:"Україна — одна з найбільших аграрних країн Європи з давньою традицією вирощування конопель. З серпня 2024 року для технічних конопель достатньо повідомити органи влади, ліцензії та квоти скасовано. Водночас постраждала від війни країна потребує приватних інвестицій, які створюють робочі місця та зберігають додану вартість у країні.",
ua1k:"Ґрунт",ua1h:"Родючий чорнозем",ua1:"Українські чорноземи належать до найродючіших у світі та створюють ідеальні умови для конопель.",
ua2k:"Право",ua2h:"Чіткі правові рамки",ua2:"Закон 2024 року регулює вирощування, переробку та медичне використання. Ізолят CBD не входить до переліку контрольованих речовин.",
ua3k:"Вплив",ua3h:"Відбудова з реальним впливом",ua3:"Кожен інвестований франк створює робочі місця в сільських регіонах і зміцнює економіку, яка має відбудуватися.",
ua4k:"Ринок",ua4h:"Близькість до ЄС",ua4:"Україна гармонізує свої стандарти продукції та харчових продуктів із ЄС, що відкриває шлях на швейцарський та європейський ринки.",
impact:"Інвестуючи тут, ви фінансуєте більше, ніж продукт: роботу, перспективи та зелене майбутнє для України.",
sus_e:"Сталий розвиток",sus_h:"Зелена лінія — від поля до пляшечки.",
sus_q:"«Коноплі — одна з небагатьох культур, що залишають ґрунт кращим, ніж він був.»",
s1h:"Природне сховище CO<sub>2</sub>",s1:"Коноплі приблизно за 100 днів нарощують велику біомасу та поглинають багато CO<sub>2</sub> з атмосфери.",
s2h:"Мало води, без пестицидів",s2:"Густа рослина сама пригнічує бур'яни й зазвичай не потребує хімічного захисту.",
s3h:"Відновлення ґрунтів",s3:"Коноплі розпушують ґрунт і можуть поглинати забруднювачі. Їх досліджували для очищення ґрунтів у Чорнобильському регіоні.",
s4h:"Уся рослина в ділі",s4:"Суцвіття — для CBD, волокно — для текстилю та будматеріалів, насіння — для харчування. Відходів майже немає.",
u_e:"Сфери застосування",u_h:"Де сьогодні використовують олію CBD",
u_l:"CBD (канабідіол) — природна сполука конопель, що не має психоактивної дії. Попит надходить одразу з багатьох галузей: це розподіляє ризики й розширює ринок.",
u1h:"Краса та догляд за шкірою",u1:"Сироватки, креми та бальзами з CBD — усталена частина натуральної косметики та швидкозростаючий преміум-сегмент.",u1t:"Косметика",
u2h:"Релакс і сон",u2:"Багато людей використовують олію CBD як частину вечірнього ритуалу, щоб розслабитися.",u2t:"Велнес",
u3h:"Спорт і відновлення",u3:"Спортсмени використовують олії та бальзами з CBD після тренувань. У 2018 році Всесвітнє антидопінгове агентство вилучило CBD із забороненого списку.",u3t:"Спорт",
u4h:"Медичні дослідження",u4:"Лікарський засіб на основі CBD схвалено в ЄС і США для лікування рідкісних форм епілепсії. Інші сфери застосування вивчаються.",u4t:"Фарма",
u5h:"Харчові продукти та напої",u5:"Олії, чаї та напої з CBD. У ЄС вони потребують дозволу як Novel Food. Хто має дозвіл — має перевагу.",u5t:"Харчі",
u6h:"Догляд за тваринами",u6:"Продукти з CBD для собак і коней — молодий ринок, що швидко зростає.",u6t:"Тварини",
u_note:"Примітка: продукти з CBD не є лікарськими засобами. ZELENA просуває свою продукцію без обіцянок лікувального ефекту та відповідно до вимог кожної країни.",
q_e:"Якість і безпека",q_h:"Безпека, яку можна перевірити",
q_l:"Натурально, чисто й легально означає: кожна партія перевірена, кожен показник задокументований, кожен крок простежується.",
q1:"Кожен урожай перед переробкою перевіряють у лабораторії на ТГК, як того вимагає український закон.",
q2:"Сертифікат аналізу незалежної лабораторії для кожної партії: вміст CBD, ТГК, пестициди та важкі метали.",
q3k:"Поле → пляшечка",q3:"Повна простежуваність за номером партії — від поля до готової пляшечки.",

let lang = "de";
function apply(l){
  lang = T[l] ? l : "de";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=T[lang][el.dataset.i18n]; if(v!==undefined) el.innerHTML=v;});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  try{localStorage.setItem("zelena-lang",lang)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));

  try{navigator.clipboard.writeText(INVEST_MAIL).then(done,fallback)}catch(e){fallback()}
}));

/* hemp leaf: seven leaflets fanned from one point */
const NS="http://www.w3.org/2000/svg";
document.querySelectorAll("[data-leaf]").forEach(g=>{
  const [cx,cy,s]=g.dataset.leaf.split(",").map(Number);
  const set=[[-96,.36],[96,.36],[-64,.62],[64,.62],[-32,.84],[32,.84],[0,1]];
  const halfW=(t,W)=>W*Math.pow(Math.sin(Math.PI*Math.min(t*1.15,1)),.75)*Math.pow(1-t,.35);
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
  const st=el("path",{d:`M${cx} ${cy-2*s} q${3*s} ${22*s} ${-2*s} ${48*s}`,stroke:"var(--leaf)","stroke-width":4.5*s,fill:"none","stroke-linecap":"round"});
  g.appendChild(st);
  set.forEach(([deg,k])=>{
    const L=118*k, W=11*k+3.5, N=Math.round(12*k+6);
    const R=[[0,0]];
    for(let i=1;i<=N;i++){
      const t0=(i-1)/N, t1=i/N, tm=t0+.75/N;
      R.push([halfW(t0+.15/N,W)*.84, -L*(t0+.15/N)]);
      R.push([halfW(tm,W)*1.06+.6, -L*tm]);
    }
    R.push([0,-L]);
    const Lf=R.slice(1,-1).reverse().map(([x,y])=>[-x,y]);
    const pts=[...R,...Lf];
    const d="M"+pts.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" L")+"Z";
    const half="M0 0 L"+R.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" L")+"Z";
    const grp=el("g",{transform:`translate(${cx} ${cy}) scale(${s}) rotate(${deg})`});
    grp.appendChild(el("path",{d,fill:"var(--leaf)",stroke:"var(--leaf)","stroke-width":.6,"stroke-linejoin":"round"}));
    grp.appendChild(el("path",{d:half,fill:"#000","fill-opacity":.14}));
    grp.appendChild(el("path",{d:`M0 -2 L0 ${-L*.94}`,stroke:"var(--bg)","stroke-opacity":.55,"stroke-width":1.1,"stroke-linecap":"round"}));
    if(s>.6){
      for(let j=1;j<=Math.round(5*k+2);j++){
        const t=j/(5*k+3), y=-L*t, w=halfW(t,W)*.8;
        grp.appendChild(el("path",{d:`M0 ${y} L${w} ${y-L*.06} M0 ${y} L${-w} ${y-L*.06}`,stroke:"var(--bg)","stroke-opacity":.3,"stroke-width":.55,fill:"none"}));
      }
    }
    g.appendChild(grp);
  });
});
